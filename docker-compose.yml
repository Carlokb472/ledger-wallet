# Spin up a local Postgres for the durable backend:
#   docker compose up -d
#   DATABASE_URL=postgres://ledger:ledger@localhost:5432/ledger go run ./cmd/server
#
# For the integration tests:
#   TEST_DATABASE_URL=postgres://ledger:ledger@localhost:5432/ledger go test ./...
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 10
