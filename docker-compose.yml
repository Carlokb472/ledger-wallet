# Local Postgres (+ optional pgAdmin) for the durable backend.
#
#   make db-up                 # start Postgres only (for app/tests)
#   make pgadmin               # start Postgres + pgAdmin GUI on :5050
#   make run-pg                # run the server against Postgres
#   make test-pg               # full suite incl. Postgres integration
#   make db-down               # stop everything (keeps data)
#
# Creates two databases: `ledger` (app) and `ledger_test` (tests), so running
# the tests never truncates app data.
services:
  db:
    image: postgres:16
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 10

  # GUI for browsing the database. Only starts with `make pgadmin` (profile
  # "tools"), so a plain `make db-up` stays lean. Reaches Postgres at host "db"
  # over the compose network — sidesteps the native-macOS OpenSSL signing bug.
  pgadmin:
    image: dpage/pgadmin4
    container_name: ledger-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ledger.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
